[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeplens"
version = "0.1.0"
description = "A course prototype for explaining synthetic sleep records."
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "tzdata>=2025.2",
    "streamlit>=1.67,<2",
    "altair>=5,<7",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
sleeplens = "sleeplens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sleeplens = ["fixtures/*.json", "resources/knowledge/*.json", "resources/knowledge/*.md", "resources/prompts/*.md", "resources/skills/*/*.md", "resources/skills/*/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["artifacts", "archive", ".state", ".venv", ".git"]

